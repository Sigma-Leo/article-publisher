services:
  - type: web
    name: article-publisher-api
    runtime: python
    rootDir: web/backend
    buildCommand: pip install -r ../../requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: CORS_ORIGINS
        sync: false
      - key: ARTICLE_DATA_DIR
        value: /opt/render/project/src
